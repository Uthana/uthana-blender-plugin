name: Build uthana-blender-plugin

on:
  pull_request:
    branches: [main]
  push: {}  # All branches (including PR branches) so required status checks are reported
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Build add-on zip
        run: make build-zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-addon-zip
          path: dist/*.zip
          if-no-files-found: error
